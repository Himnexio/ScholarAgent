name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies (unit tests only need the stdlib + pytest)
        run: pip install pytest
      - name: Byte-compile everything
        run: python -m compileall -q scholaragent evaluation training app.py
      - name: Unit tests
        run: pytest -q
